name: Docker PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'Dockerfile.dev'
      - 'docker/**'
      - 'pyproject.toml'
      - '.github/workflows/docker-*.yml'

env:
  IMAGE_NAME: mcp-server-tree-sitter-pr

jobs:
  validate-dockerfile:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile (production)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Lint Dockerfile (dev)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.dev
          failure-threshold: warning

  build-and-test:
    name: Build and Test PR
    runs-on: ubuntu-latest
    needs: validate-dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dev
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test production image - Version
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:prod --version || echo "Version check skipped"

      - name: Test production image - Imports
        run: |
          echo "Testing Python imports..."
          docker run --rm ${{ env.IMAGE_NAME }}:prod \
            python -c "import mcp_server_tree_sitter; print('✓ mcp_server_tree_sitter')"
          docker run --rm ${{ env.IMAGE_NAME }}:prod \
            python -c "import tree_sitter; print('✓ tree_sitter')"
          docker run --rm ${{ env.IMAGE_NAME }}:prod \
            python -c "from tree_sitter_language_pack import get_language; get_language('python'); print('✓ language pack')"

      - name: Test dev image - Run tests
        run: |
          echo "Running unit tests..."
          docker run --rm ${{ env.IMAGE_NAME }}:dev pytest -v --tb=short

      - name: Check image sizes
        run: |
          echo "## Image Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY

          PROD_SIZE=$(docker images ${{ env.IMAGE_NAME }}:prod --format "{{.Size}}")
          DEV_SIZE=$(docker images ${{ env.IMAGE_NAME }}:dev --format "{{.Size}}")

          echo "| Production | $PROD_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Development | $DEV_SIZE |" >> $GITHUB_STEP_SUMMARY

      - name: Security scan - Production
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:prod
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities in PR

      - name: Security scan - Dev
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:dev
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    permissions:
      pull-requests: write

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Docker images built and tested successfully!\n\n' +
                    '**Images:**\n' +
                    '- Production image: Built and validated\n' +
                    '- Development image: Built and tested\n\n' +
                    '**Tests:**\n' +
                    '- ✓ Version check\n' +
                    '- ✓ Import checks\n' +
                    '- ✓ Unit tests (dev)\n' +
                    '- ✓ Security scan\n\n' +
                    'See workflow run for detailed results.'
            })
